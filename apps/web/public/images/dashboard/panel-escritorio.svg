<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="539" viewBox="0 0 1030 539" role="img" aria-label="Panel de servicios de Neolutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a18"/>
      <stop offset="1" stop-color="#090e12"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fc4b3" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1fc4b3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".8">
      <stop offset="0" stop-color="#00a999" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00a999" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Inter Variable", Inter, "Segoe UI", system-ui, sans-serif; fill: #e8ecf5; }
      .sm { font-size: 11px; fill: #c9c2dc; }
      .xs { font-size: 10px; fill: #9b92b4; }
      .md { font-size: 13px; font-weight: 600; }
      .ok { font-size: 10px; fill: #2ecc8f; }
    </style>
  </defs>

  <rect width="1030" height="539" fill="url(#bg)"/>
  <rect x="190" width="840" height="240" fill="url(#glow)"/>

  <!-- Barra lateral -->
  <rect width="190" height="539" fill="#060c0c"/>
  <line x1="190" y1="0" x2="190" y2="539" stroke="#fff" stroke-opacity=".08"/>
  <path d="M22 40V22l18 18V22" fill="none" stroke="#1fc4b3" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="37" class="md">Neolutions</text>

  <rect x="12" y="62" width="166" height="32" rx="9" fill="#0f1e1d" stroke="#1fc4b3" stroke-opacity=".35"/>
  <rect x="26" y="73" width="10" height="10" rx="2.5" fill="#1fc4b3"/>
  <text x="46" y="82" class="sm" style="fill:#e8ecf5">Panel</text>

  <g>
    <circle cx="31" cy="124" r="4" fill="#1fc4b3" fill-opacity=".7"/><text x="46" y="128" class="sm">Soporte técnico</text>
    <circle cx="31" cy="156" r="4" fill="#1fc4b3" fill-opacity=".7"/><text x="46" y="160" class="sm">Cableado estructurado</text>
    <circle cx="31" cy="188" r="4" fill="#f2b544" fill-opacity=".8"/><text x="46" y="192" class="sm">Cámaras de seguridad</text>
    <circle cx="31" cy="220" r="4" fill="#a78bfa" fill-opacity=".8"/><text x="46" y="224" class="sm">Páginas web</text>
    <circle cx="31" cy="252" r="4" fill="#a78bfa" fill-opacity=".8"/><text x="46" y="256" class="sm">Apps móviles</text>
    <circle cx="31" cy="284" r="4" fill="#a78bfa" fill-opacity=".8"/><text x="46" y="288" class="sm">Sistemas y automatización</text>
    <circle cx="31" cy="316" r="4" fill="#a78bfa" fill-opacity=".8"/><text x="46" y="320" class="sm">SEO y SEM</text>
  </g>

  <!-- Encabezado -->
  <text x="214" y="37" class="md">Panel de servicios</text>
  <circle cx="838" cy="33" r="3.5" fill="#2ecc8f"/>
  <text x="848" y="37" class="ok">Atención disponible</text>
  <rect x="950" y="18" width="60" height="30" rx="15" fill="#0f1e1d" stroke="#fff" stroke-opacity=".12"/>
  <text x="980" y="37" class="xs" text-anchor="middle" style="fill:#e8ecf5">Cotizar</text>
  <line x1="190" y1="62" x2="1030" y2="62" stroke="#fff" stroke-opacity=".08"/>

  <!-- Tarjeta principal -->
  <rect x="214" y="82" width="792" height="214" rx="16" fill="url(#card)" stroke="#fff" stroke-opacity=".09"/>
  <text x="238" y="114" class="sm">Tu negocio, en un solo lugar</text>
  <text x="238" y="150" style="font-size:28px;font-weight:600">7 servicios, un solo equipo</text>
  <path d="M238 272 C 330 262, 380 236, 470 240 S 620 204, 700 198 S 880 142, 982 112 V 282 H 238 Z" fill="url(#area)"/>
  <path d="M238 272 C 330 262, 380 236, 470 240 S 620 204, 700 198 S 880 142, 982 112" fill="none" stroke="#1fc4b3" stroke-width="2.2"/>
  <circle cx="982" cy="112" r="4.5" fill="#bff3e9"/>
  <circle cx="982" cy="112" r="10" fill="#1fc4b3" fill-opacity=".24"/>

  <!-- Bloques -->
  <g>
    <rect x="214" y="314" width="252" height="130" rx="14" fill="url(#card)" stroke="#fff" stroke-opacity=".09"/>
    <rect x="232" y="332" width="30" height="30" rx="9" fill="#1fc4b3" fill-opacity=".16"/>
    <path d="M240 351v-3a7 7 0 0 1 14 0v3" fill="none" stroke="#1fc4b3" stroke-width="1.8" stroke-linecap="round"/>
    <text x="232" y="388" class="md">Soporte e infraestructura</text>
    <circle cx="236" cy="415" r="3" fill="#2ecc8f"/><text x="246" y="419" class="ok">Disponible</text>

    <rect x="484" y="314" width="252" height="130" rx="14" fill="url(#card)" stroke="#fff" stroke-opacity=".09"/>
    <rect x="502" y="332" width="30" height="30" rx="9" fill="#f2b544" fill-opacity=".16"/>
    <circle cx="517" cy="347" r="6" fill="none" stroke="#f2b544" stroke-width="1.8"/><circle cx="517" cy="347" r="2" fill="#f2b544"/>
    <text x="502" y="388" class="md">Seguridad</text>
    <circle cx="506" cy="415" r="3" fill="#2ecc8f"/><text x="516" y="419" class="ok">Disponible</text>

    <rect x="754" y="314" width="252" height="130" rx="14" fill="url(#card)" stroke="#fff" stroke-opacity=".09"/>
    <rect x="772" y="332" width="30" height="30" rx="9" fill="#a78bfa" fill-opacity=".16"/>
    <path d="M781 342l-4 5 4 5M793 342l4 5-4 5" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="772" y="388" class="md">Desarrollo y marketing digital</text>
    <circle cx="776" cy="415" r="3" fill="#2ecc8f"/><text x="786" y="419" class="ok">Disponible</text>
  </g>

  <!-- Pasos -->
  <rect x="214" y="462" width="792" height="60" rx="14" fill="url(#card)" stroke="#fff" stroke-opacity=".09"/>
  <text x="238" y="496" class="sm" style="fill:#1fc4b3">Cotización gratis</text>
  <text x="400" y="496" class="sm">Escuchamos</text>
  <text x="520" y="496" class="sm">Cotizamos</text>
  <text x="640" y="496" class="sm">Implementamos</text>
  <text x="790" y="496" class="sm">Te damos soporte</text>
</svg>
