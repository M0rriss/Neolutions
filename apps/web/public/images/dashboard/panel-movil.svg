  <rect x="16" y="490" width="287" height="66" rx="33" fill="#0f1e1d" stroke="#1fc4b3" stroke-opacity=".4"/>
  <text x="159.5" y="528" text-anchor="middle" class="md" style="fill:#bff3e9">Cotización gratis</text>
